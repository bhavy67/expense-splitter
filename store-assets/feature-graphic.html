<!doctype html>
<!-- Play Store feature graphic source: open in Chrome at a 1024×500 viewport and screenshot. Uses the PNGs in this folder
     (retake 2-expenses.png and 3-settle-up.png from the monochrome UI first). Mark geometry matches frontend/scripts/gen-icons.mjs. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: #0A0A0A; }
  body { font-family: 'Inter', sans-serif; color: #F5F5F5; position: relative; -webkit-font-smoothing: antialiased; }

  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .wordmark { font-weight: 600; font-size: 44px; letter-spacing: -0.02em; line-height: 1; }
  h1 { margin-top: 36px; font-weight: 600; font-size: 52px; line-height: 1.05; letter-spacing: -0.03em; }
  h1 span { color: #A3A3A3; }
  .points { margin-top: 32px; display: flex; gap: 10px; }
  .point { font-size: 16px; font-weight: 500; padding: 9px 16px; border: 1px solid #333333; border-radius: 999px; color: #F5F5F5; }

  .phone { position: absolute; width: 228px; height: 405px; border: 1px solid #333333; border-radius: 28px; overflow: hidden;
    background: #111111; box-shadow: 0 24px 60px rgb(0 0 0 / 0.6); }
  .phone img { width: 100%; display: block; }
  .p1 { left: 620px; top: 58px; }
  .p2 { left: 772px; top: 120px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 32 32" fill="none">
        <mask id="cut"><rect width="32" height="32" fill="#fff"/><path d="M25 4 L15.5 28" stroke="#000" stroke-width="5" stroke-linecap="round"/></mask>
        <g mask="url(#cut)" stroke="#F5F5F5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7 H21"/><path d="M6 12.5 H21"/><path d="M6 7 H11.5 A5.5 5.5 0 0 1 11.5 18 H6 L15.6 25.5"/>
        </g>
        <path d="M25 4 L15.5 28" stroke="#F5F5F5" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="wordmark">SplitItt</div>
    </div>
    <h1>Split expenses,<br><span>not friendships.</span></h1>
    <div class="points">
      <div class="point">No sign-up</div>
      <div class="point">Settle via UPI</div>
      <div class="point">Works offline</div>
    </div>
  </div>
  <div class="phone p1"><img src="2-expenses.png" alt=""></div>
  <div class="phone p2"><img src="3-settle-up.png" alt=""></div>
</body>
</html>
