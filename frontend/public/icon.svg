<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- ₹ Rupee in electric lime (scaled 16× from 32×32 source) -->
  <text x="32" y="432" font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="900" font-size="400" fill="#b9f542">₹</text>
  <!-- Diagonal slash through the visual center of ₹ -->
  <line x1="464" y1="48" x2="48" y2="400" stroke="#fafaf7" stroke-width="48" stroke-linecap="round"/>
</svg>
