<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#128a5c" />
    <meta name="description" content="Split group expenses with friends, roommates, and travel crews. Track who paid, see who owes what, and settle up — fast." />

    <!-- Standard icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Apple / iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SplitItt" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#128a5c" />

    <!-- Open Graph / share previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SplitItt — Split expenses, not friendships" />
    <meta property="og:description" content="Split group expenses with friends, roommates, and travel crews." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <title>SplitItt — Split expenses, not friendships</title>

    <!-- Anti-flicker: apply dark class before first paint -->
    <script>
      try {
        var t = localStorage.getItem('splititt-theme');
        var d = (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) || t === 'dark';
        if (d) document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
